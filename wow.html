<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾泽拉斯英雄志 — 魔兽世界英雄收藏卡 · herocards</title>
<meta name="description" content="魔兽世界 24 位英雄的烫金浮雕收藏卡展示：联盟、部落与中立传说，油画肖像与全幅金线蚀刻卡面。">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Jost:wght@400;500&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<link rel="stylesheet" href="css/wow.css">
</head>
<body>

<header class="wow-header">
  <a class="wow-home" href="index.html" aria-label="返回首页">‹ herocards</a>
  <div class="wow-brand">
    <span class="wow-brand-en">Heroes of Azeroth</span>
    <h1 class="wow-brand-zh">艾泽拉斯英雄志</h1>
    <p class="wow-brand-sub">二十四位英雄 · 烫金浮雕收藏卡</p>
  </div>
  <div class="wow-count" id="wowCount" aria-live="polite">24 位英雄</div>
</header>

<nav class="wow-chips" id="wowChips" aria-label="阵营筛选">
  <button class="chip is-active" data-f="all" type="button">全部</button>
  <button class="chip chip-alliance" data-f="alliance" type="button">联盟</button>
  <button class="chip chip-horde" data-f="horde" type="button">部落</button>
  <button class="chip chip-neutral" data-f="neutral" type="button">中立</button>
</nav>

<main class="wow-grid" id="wowGrid" aria-label="英雄卡墙"></main>

<footer class="wow-footer">
  <p>卡牌由 WebGL 烫金浮雕管线实时渲染 · 希尔瓦娜斯为全幅金线蚀刻基准卡</p>
  <p><a href="app.html">华夏人物图鉴 ›</a></p>
</footer>

<!-- 英雄详情（整页视图，非弹层）：大卡片 + 资料 -->
<section class="view" id="view" hidden aria-label="英雄详情">
  <button class="view-back" id="viewBack" type="button">‹ 卡墙</button>
  <div class="view-body">
    <div class="stage" id="stage">
      <div class="tilt" id="tilt">
        <canvas class="card-canvas" id="cardCanvas" width="1329" height="2048"></canvas>
        <div class="shine" aria-hidden="true"></div>
      </div>
    </div>
    <aside class="meta">
      <p class="m-title-en" id="mTitleEn"></p>
      <h2 class="m-name" id="mName"></h2>
      <p class="m-title-zh" id="mTitleZh"></p>
      <div class="m-badges" id="mBadges"></div>
      <blockquote class="m-quote" id="mQuote"></blockquote>
      <p class="m-lore" id="mLore"></p>
      <div class="m-stats" id="mStats"></div>
    </aside>
  </div>
</section>

<script>
/* 展示页驱动配置（js/showcase.js 消费） */
window.SHOWCASE = {
  theme: 'wow',
  gridEl: 'wowGrid',
  chipsEl: 'wowChips',
  countEl: 'wowCount',
  chipField: 'faction',
  countUnit: '位英雄',
  chipColors: { alliance: '#4a8fdd', horde: '#c41f3b', neutral: '#c8a55a' },
  chipLabels: { alliance: '联盟', horde: '部落', neutral: '中立' },
  badges: function (hero) {
    var cls = (window.WOW_CLASS_INFO || {})[hero.class];
    var rar = (window.WOW_RARITY_INFO || {})[hero.rarity];
    return [
      [(window.SHOWCASE.chipLabels)[hero.faction], (window.SHOWCASE.chipColors)[hero.faction]],
      [cls && cls.zh, cls && cls.color],
      [hero.race && hero.race.zh, null],
      [rar && rar.zh, rar && rar.color]
    ];
  },
  subtitle: function (hero) { return hero.title.zh + ' · ' + hero.race.zh; },
  titleEn: function (hero) { return hero.title.en; },
  statLabels: { might: '武力', magic: '魔法', resolve: '意志' },
  statColor: function (hero) {
    var cls = (window.WOW_CLASS_INFO || {})[hero.class];
    return cls ? cls.color : '#c8a55a';
  },
  fonts: [
    '700 40px "Noto Serif SC"',
    '500 13px Cinzel',
    '500 18px Jost',
    '400 22px "Noto Serif SC"'
  ],
  miniMode: 'canvas',
  hasMap: false
};
</script>
<script src="js/heroes-data-wow.js"></script>
<script src="js/card-art.js"></script>
<script src="js/showcase.js"></script>
</body>
</html>
