<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>华夏人物图鉴 — 二十四先贤 · 每日一晤</title>
<meta name="description" content="国风人物图鉴：每日请一张卡，解锁一位先贤的生平行旅。掐丝珐琅卡面，收藏保存在本地，无需注册。">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!-- 国风题款/匾额毛笔体：本地子集（Ma Shan Zheng, SIL OFL），离线可用 -->
<style>@font-face { font-family: 'Ma Shan Zheng'; src: url('assets/fonts/MaShanZheng-subset.woff2') format('woff2'); font-weight: 400; font-display: swap; }</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

<!-- ================================================================ 页头 -->
<header class="site-header">
  <div class="brand">
    <span class="brand-plaque">华夏人物图鉴</span>
    <span class="brand-sub">二十四先贤 · 每日一晤</span>
  </div>
  <!-- 收藏进度朱印：x/24，由 app.js 实时更新 -->
  <div class="collect-seal" id="collectBadge" title="收藏进度" aria-live="polite">
    <span class="cs-label">已集</span>
    <span class="cs-count" id="collectCount">0/24</span>
  </div>
</header>

<main>
  <!-- ========================================================== Tab · 请卡 -->
  <section class="tab-panel is-active" id="panel-draw" role="tabpanel" aria-label="请卡">

    <!-- 签筒舞台：未请卡时的仪式入口 -->
    <div class="tube-stage" id="tubeStage">
      <div class="tube-wrap" id="tubeWrap">
        <svg class="tube-svg" viewBox="0 0 160 220" aria-hidden="true">
          <!-- 探出筒口的签支 -->
          <g class="tube-sticks">
            <rect x="62" y="18" width="7" height="70" rx="3" class="stick"/>
            <rect x="74" y="10" width="7" height="78" rx="3" class="stick"/>
            <rect x="86" y="16" width="7" height="72" rx="3" class="stick"/>
            <rect x="56" y="30" width="7" height="58" rx="3" class="stick stick-dim"/>
            <rect x="98" y="28" width="7" height="60" rx="3" class="stick stick-dim"/>
          </g>
          <!-- 签筒身 -->
          <path class="tube-body" d="M46 84 h68 v96 q0 26 -34 26 q-34 0 -34 -26 Z"/>
          <ellipse class="tube-rim" cx="80" cy="84" rx="34" ry="8"/>
          <path class="tube-band" d="M46 108 h68 v10 h-68 Z"/>
          <!-- 筒身回纹示意 -->
          <g class="tube-leiwen">
            <path d="M56 113 h8 v-4 h4 M66 113 h8 v-4 h4 M76 113 h8 v-4 h4 M86 113 h8 v-4 h4 M96 113 h8 v-4 h4" fill="none"/>
          </g>
          <!-- 筒身小篆印 -->
          <rect class="tube-seal" x="71" y="138" width="18" height="18" rx="3"/>
          <text class="tube-seal-char" x="80" y="152" text-anchor="middle">签</text>
        </svg>
        <!-- 摇出的签（仪式动画用，CSS 驱动） -->
        <div class="tube-fallen-stick" id="fallenStick" aria-hidden="true">
          <span class="fs-text">今日一签</span>
        </div>
      </div>
      <p class="tube-hint" id="tubeHint">晨光初上，宜请一签</p>
      <button class="seal-btn" id="summonBtn" type="button">
        <span class="seal-btn-text">今日请卡</span>
      </button>
      <p class="tube-note">收藏保存在本地 · 无需注册</p>
    </div>

    <!-- 卡牌舞台：请到卡后展示（结构与渲染契约沿用原站） -->
    <div class="card-stage" id="cardStage" hidden>
      <div class="card-shadow" id="cardShadow" aria-hidden="true"></div>
      <div class="card-mover" id="cardMover">
        <div class="card-tilt" id="cardTilt">
          <div class="card-obj" id="cardObj">
            <div class="card-face" id="cardFace"></div>
          </div>
          <!-- 卡背：与正面共面，预旋转 180°（静态降级层，GL 纹理由 CardArt.paintBack 供给） -->
          <div class="card-back" aria-hidden="true">
            <div class="card-face card-face-back">
              <span class="cb-seal">群英</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 卡下题款：请到卡后显示该人物 quote -->
    <blockquote class="card-quote" id="cardQuote" hidden>
      <span class="qmark">「</span><em id="quoteText"></em><span class="qmark">」</span>
    </blockquote>

    <!-- 已连续请卡提示 -->
    <p class="draw-streak" id="drawStreak" hidden></p>

    <!-- 分享条：请到新卡后浮出 -->
    <div class="share-bar" id="shareBar" hidden>
      <button class="share-btn share-note" id="shareNoteBtn" type="button">发笔记</button>
      <button class="share-btn share-save" id="shareSaveBtn" type="button">存相册</button>
    </div>
  </section>

  <!-- ========================================================== Tab · 图鉴 -->
  <section class="tab-panel" id="panel-dex" role="tabpanel" aria-label="图鉴">
    <div class="collection-head">
      <p class="eyebrow-vert">名录</p>
      <h2 class="collection-title">收藏图鉴</h2>
      <p class="collection-sub">已请到的先贤永驻图鉴；尚未相遇的，以剪影静候。</p>

      <!-- 门类筛选 chips：帝王/将相/文人/奇士（app.js 生成） -->
      <div class="class-chips" id="classChips" role="group" aria-label="门类筛选"></div>

      <div class="progress">
        <div class="progress-meta">
          <span id="progressText">已集 0 / 24</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="dex-grid" id="dex-grid"></div>
  </section>
</main>

<!-- ================================================================ 人物详情页 -->
<!-- 全屏视图（非弹窗）：3D 立体卡 + 题款 + 探索入口；hash #/hero/<id> -->
<section class="view-panel" id="panel-hero" hidden aria-label="人物详情">
  <button class="view-back" id="heroBack" type="button" aria-label="返回图鉴">‹ 图鉴</button>

  <!-- 详情卡舞台：结构与请卡页 card-stage 同构，GL 光照层挂在 card-obj2 上 -->
  <div class="card-stage hero-stage" id="heroStage">
    <div class="card-shadow" id="heroShadow" aria-hidden="true"></div>
    <div class="card-mover" id="heroMover">
      <div class="card-tilt" id="heroTilt">
        <div class="card-obj" id="cardObj2">
          <div class="card-face" id="cardFace2"></div>
        </div>
      </div>
    </div>
  </div>

  <blockquote class="card-quote" id="heroQuote" hidden>
    <span class="qmark">「</span><em id="heroQuoteText"></em><span class="qmark">」</span>
  </blockquote>

  <div class="hero-actions">
    <button class="seal-btn" id="exploreBtn" type="button">
      <span class="seal-btn-text">探 索</span>
    </button>
    <div class="share-bar share-bar-hero" id="heroShareBar">
      <button class="share-btn share-note" id="heroNoteBtn" type="button">发笔记</button>
      <button class="share-btn share-save" id="heroSaveBtn" type="button">存相册</button>
    </div>
  </div>
</section>

<!-- ================================================================ 行旅地图页 -->
<!-- 全屏视图：共享 2.5D 大地图四向拖动；hash #/hero/<id>/map -->
<section class="view-panel view-panel-map" id="panel-map" hidden aria-label="行旅地图">
  <div class="map-head">
    <button class="view-back" id="mapBack" type="button" aria-label="返回详情">‹ 返回</button>
    <span class="map-title" id="mapTitle"></span>
  </div>
  <div class="atlas-mount" id="atlasMount"></div>
</section>

<!-- ================================================================ 底部 Tab -->
<nav class="tab-bar" aria-label="底部导航">
  <button class="tab-btn is-active" id="tabDraw" type="button" data-tab="draw" aria-label="请卡">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 3h8l-1 3H9Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M7 8h10v9a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M10.5 6V2.8M13.5 6V2.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <span>请卡</span>
  </button>
  <button class="tab-btn" id="tabDex" type="button" data-tab="dex" aria-label="图鉴">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 5.5h9a3 3 0 0 1 3 3v10H8a3 3 0 0 0-3 3Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M5 5.5v13M9 10h4.5M9 13.5h4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <span>图鉴</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</div><!-- /app-shell -->

<!-- 按契约顺序引入：人物数据 → 卡面 → 地图数据/投影/交互 → 分享桥 → 主程序 -->
<script src="js/heroes-data.js"></script>
<script src="js/card-art.js"></script>
<script src="js/atlas-data.js"></script>
<script src="js/map-geometry.js"></script>
<script src="js/atlas-map.js"></script>
<script src="js/xhs-bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
